name: Publish Silben-App
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  deploy:
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public app files
        run: |
          mkdir -p _site
          cp index.html style.css app.js manifest.webmanifest sw.js _site/
          cp speech-test.html speech-test.js speech-worker.js _site/
          cp -R icons _site/icons
          sed -i "s/__APP_VERSION__/${GITHUB_SHA:0:7}/" _site/index.html
          # Neue Dateistände erhalten automatisch einen eigenen Offline-Cache.
          sed -i "s/\${CACHE_PREFIX}v[0-9][0-9]*/\${CACHE_PREFIX}${GITHUB_SHA}/" _site/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
