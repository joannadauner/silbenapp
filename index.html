<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Silben lesen</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- STARTSEITE -->
        <section id="start-screen" class="screen active">

            <h1>Silben lesen</h1>

            <p class="intro">
                Welche Silbe siehst du?
            </p>

            <button
                id="start-button"
                class="primary-button"
            >
                Übung starten
            </button>

            <button
                id="settings-button"
                class="secondary-button"
            >
                Silben einstellen
            </button>

        </section>


        <!-- EINSTELLUNGEN -->
        <section id="settings-screen" class="screen">

            <h2>Silben einstellen</h2>

            <p>
                Trage für jede Woche die neu gelernten Silben ein und hake die Wochen an,
                die geübt werden sollen. Die höchste ausgewählte Woche wird häufiger geübt.
            </p>

            <div id="weeks-container"></div>

            <button
                id="add-week-button"
                class="secondary-button"
            >
                + Woche hinzufügen
            </button>

            <button
                id="save-settings-button"
                class="primary-button"
            >
                Speichern
            </button>

            <button
                id="back-button"
                class="text-button"
            >
                Zurück
            </button>

        </section>


        <!-- ÜBUNG -->
        <section id="practice-screen" class="screen">

            <div class="practice-header">

                <span id="progress">
                    Aufgabe 1
                </span>

            </div>


            <div class="syllable-panel">
                <div id="syllable-card">

                    MA

                </div>
                <div class="answer-feedback">
                    <span data-answer-feedback="correct" hidden>
                        <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
                            <path d="m12 33 13 13 27-29" fill="none" stroke="#348052"
                                stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <span data-answer-feedback="repeat" hidden>
                        <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
                            <path d="M49 24a20 20 0 1 0 2 18M49 10v16H33" fill="none"
                                stroke="#2869b0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <span id="answer-feedback-text" class="visually-hidden" role="status" aria-live="polite"></span>
                </div>
            </div>


            <div class="answer-buttons">

                <button
                    id="correct-button"
                    class="correct-button"
                >
                    ✓ Richtig
                </button>

                <button
                    id="again-button"
                    class="again-button"
                >
                    ↻ Nochmal
                </button>

                <button
                    id="dont-know-button"
                    class="dont-know-button"
                >
                    ? Weiß ich nicht
                </button>

            </div>

        </section>


        <!-- ENDE -->
        <section id="finish-screen" class="screen">

            <h2>Leserunde geschafft!</h2>

            <div class="finish-symbol">
                <div data-award="trophy" hidden>
                    <svg viewBox="0 0 200 200" role="img" aria-labelledby="trophy-title">
                        <title id="trophy-title">Goldener Pokal – alles direkt geschafft</title>
                        <path d="M55 43H25v22c0 28 20 40 43 40M145 43h30v22c0 28-20 40-43 40"
                            fill="none" stroke="#b67c08" stroke-width="12" stroke-linejoin="round"/>
                        <path d="M54 28h92v43c0 31-19 51-46 51S54 102 54 71Z"
                            fill="#f4c542" stroke="#b67c08" stroke-width="6"/>
                        <path d="M68 40v29c0 15 4 24 10 30" fill="none" stroke="#ffe9a0"
                            stroke-width="9" stroke-linecap="round"/>
                        <path d="M100 124v28" stroke="#b67c08" stroke-width="14"/>
                        <path d="M74 151h52l12 25H62Z" fill="#f4c542" stroke="#b67c08" stroke-width="6"/>
                        <rect x="55" y="175" width="90" height="12" rx="6" fill="#b67c08"/>
                    </svg>
                </div>
                <div data-award="star" hidden>
                    <svg viewBox="0 0 200 200" role="img" aria-labelledby="star-title">
                        <title id="star-title">Silberner Stern – mit Übung geschafft</title>
                        <path d="m100 14 27 55 61 9-44 43 10 62-54-29-54 29 10-62-44-43 61-9Z"
                            fill="#cdd3dc" stroke="#707b8b" stroke-width="6" stroke-linejoin="round"/>
                        <path d="m100 32-20 43-39 6" fill="none" stroke="#f4f6fa"
                            stroke-width="7" stroke-linecap="round"/>
                        <circle cx="80" cy="99" r="6" fill="#354052"/>
                        <circle cx="120" cy="99" r="6" fill="#354052"/>
                        <path d="M80 119q20 23 40 0" fill="none" stroke="#354052"
                            stroke-width="6" stroke-linecap="round"/>
                    </svg>
                </div>
                <div data-award="check" hidden>
                    <svg viewBox="0 0 200 200" role="img" aria-labelledby="check-title">
                        <title id="check-title">Grüner Haken – für heute geschafft</title>
                        <circle cx="100" cy="100" r="85" fill="#e4f4e9" stroke="#348052" stroke-width="7"/>
                        <path d="m57 102 29 29 57-62" fill="none" stroke="#348052"
                            stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>

            <p id="finish-message">
                Du hast deine Leserunde beendet.
            </p>

            <button
                id="restart-button"
                class="primary-button"
            >
                Noch eine Runde
            </button>

            <button
                id="finish-home-button"
                class="secondary-button"
            >
                Zur Startseite
            </button>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
